# cargo-deny gates, run by the CI `deps` job.

[advisories]
# Any unmaintained or vulnerable dependency fails the build. Add a specific
# `ignore = ["RUSTSEC-XXXX-NNNN"]` entry with a comment rather than relaxing
# the whole gate.
yanked = "deny"

[licenses]
# This allowlist gates third-party dependencies only. Our own workspace crates
# are AGPL-3.0-or-later (docs/LICENSING.md, ADR-0015) and are skipped via
# `private.ignore` below - they all carry `publish = false`.
#
# The platform is AGPL-3.0-or-later and the spec/SDK zone is MIT OR Apache-2.0.
# Both zones can absorb permissive dependencies; neither can absorb a copyleft
# dependency without changing the zone's own terms, so the allowlist is
# permissive-only and adding to it is a deliberate decision.
private = { ignore = true }
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.9

# Minecraft-derived data is not a dependency and carries no grant from us
# (NOTICE, ADR-0015); it is checked by the CI `licensing` job instead.

[bans]
# Duplicate versions are visible, not fatal: a transitive diamond is usually
# out of our hands. Determinism (ADR-0007) is what actually matters, and that
# is enforced by the conformance suite.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
