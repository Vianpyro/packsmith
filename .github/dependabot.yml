# Keep the pinned GitHub Actions current. Scoped to the actions ecosystem on
# purpose: Cargo advisory and version drift is already watched by the CI
# `deps` job (cargo-deny) and its weekly cron, so a second Cargo feed here
# would only add noise. All action bumps land in one grouped weekly PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [ci-cd, dependencies]
    commit-message:
      prefix: "ci"
