# Two languages are scanned here:
#   - rust: the compiler and the CLI, the code that matters. build-mode: none
#     - CodeQL's Rust extractor parses source directly, no cargo build.
#   - actions: the workflows in this directory themselves (injection via
#     untrusted ${{ }} expansion, secrets misuse).
# JavaScript joins this list when web/ exists (Phase 4).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v3
