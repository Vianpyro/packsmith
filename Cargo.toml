[workspace]
resolver = "3"
members = [
    "crates/packsmith-ir",
    "crates/packsmith-mcversion",
    "crates/packsmith-compiler",
    "crates/packsmith-emit",
    "crates/packsmith-blocks",
    "crates/packsmith-cli",
    "xtask",
]

# Inherited by every member with `field.workspace = true`. The licence is the
# Zone 1 platform licence (docs/LICENSING.md); a Zone 2 crate overrides it
# locally rather than relaxing this default.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Vianpyro/packsmith"

# Shared dependency versions. A crate opts in with `dep.workspace = true`.
# serde/serde_json: target data is JSON on disk and the std has no JSON reader
# or writer. thiserror: the typed-error convention for libraries. anyhow: CLI
# and xtask only.
[workspace.dependencies]
packsmith-ir = { path = "crates/packsmith-ir", version = "0.1.0" }
packsmith-mcversion = { path = "crates/packsmith-mcversion", version = "0.1.0" }
packsmith-compiler = { path = "crates/packsmith-compiler", version = "0.1.0" }
packsmith-emit = { path = "crates/packsmith-emit", version = "0.1.0" }
packsmith-blocks = { path = "crates/packsmith-blocks", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
